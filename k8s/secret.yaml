# DO NOT commit real secrets here.
# Use scripts/k8s-secrets.sh to generate this file from AWS Secrets Manager,
# then apply it: kubectl apply -f /tmp/pingpulse-secrets.yaml
#
# This file is a TEMPLATE showing the expected structure.
# Values must be base64-encoded: echo -n "mypassword" | base64
apiVersion: v1
kind: Secret
metadata:
  name: pingpulse-secrets
  namespace: pingpulse
type: Opaque
stringData:
  # JWT signing key — from Terraform output jwt_secret_arn
  JWT_SECRET: "REPLACE_WITH_JWT_SECRET"

  # PostgreSQL passwords — from Terraform Secrets Manager (auto-generated, 32 chars)
  AUTH_POSTGRES_PASSWORD:     "REPLACE_WITH_AUTH_DB_PASSWORD"
  NOTIF_POSTGRES_PASSWORD:    "REPLACE_WITH_NOTIFICATIONS_DB_PASSWORD"
  ANALYTICS_POSTGRES_PASSWORD: "REPLACE_WITH_ANALYTICS_DB_PASSWORD"

  # SMTP credentials (for AWS SES: use SMTP IAM user access key)
  SMTP_USER:     "REPLACE_WITH_SMTP_USER"
  SMTP_PASSWORD: "REPLACE_WITH_SMTP_PASSWORD"
