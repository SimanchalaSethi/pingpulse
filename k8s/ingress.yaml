# AWS Load Balancer Controller must be installed in the cluster.
# Install: https://docs.aws.amazon.com/eks/latest/userguide/aws-load-balancer-controller.html
# Or use: make install-alb-controller
#
# This creates an ALB that routes:
#   /api/*  → api-gateway service
#   /*      → frontend service
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pingpulse-ingress
  namespace: pingpulse
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # Redirect HTTP → HTTPS
    alb.ingress.kubernetes.io/actions.ssl-redirect: |
      {"Type":"redirect","RedirectConfig":{"Protocol":"HTTPS","Port":"443","StatusCode":"HTTP_301"}}
    # Replace with your ACM certificate ARN
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:REGION:ACCOUNT:certificate/CERT-ID"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
