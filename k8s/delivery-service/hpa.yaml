# Horizontal Pod Autoscaler — scales delivery workers based on CPU
# Redis stream backlog (XPENDING count) is the ideal metric,
# but requires a custom metrics adapter. CPU is a simpler starting point.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: delivery-service-hpa
  namespace: pingpulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: delivery-service
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
