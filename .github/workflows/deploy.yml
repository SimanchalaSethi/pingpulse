name: Deploy — Build, Push to ECR, Deploy to EKS

on:
  push:
    branches: [main]   # deploy on every merge to main

env:
  AWS_REGION:  ap-southeast-2     # change to your region
  GITHUB_REPO: SimanchalaSethi/pingpulse
  EKS_CLUSTER: pingpulse-production
  K8S_NS:      pingpulse

jobs:
  # ── Build + Push all service images to ECR in parallel ───────────────────
  push-images:
    name: Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: .
            dockerfile: services/api-gateway/Dockerfile
          - service: auth-service
            context: .
            dockerfile: services/auth-service/Dockerfile
          - service: notification-service
            context: .
            dockerfile: services/notification-service/Dockerfile
          - service: delivery-service
            context: .
            dockerfile: services/delivery-service/Dockerfile
          - service: analytics-service
            context: .
            dockerfile: services/analytics-service/Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    permissions:
      id-token: write   # for OIDC auth to AWS
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/pingpulse/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/pingpulse/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ── Update Kubernetes deployments with the new image tags ────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [push-images]

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Apply ConfigMap and Namespace
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml

      # Secrets are applied once manually — never re-applied by CI
      # kubectl apply -f /path/to/secrets.yaml  (done in initial deploy)

      - name: Deploy services
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SERVICES="api-gateway auth-service notification-service delivery-service analytics-service frontend"
          for SERVICE in $SERVICES; do
            kubectl set image deployment/$SERVICE \
              $SERVICE=$ECR_REGISTRY/pingpulse/$SERVICE:$IMAGE_TAG \
              -n ${{ env.K8S_NS }}
          done

      - name: Apply K8s manifests (non-image resources)
        run: |
          kubectl apply -f k8s/auth-service/service.yaml
          kubectl apply -f k8s/notification-service/service.yaml
          kubectl apply -f k8s/delivery-service/service.yaml
          kubectl apply -f k8s/delivery-service/hpa.yaml
          kubectl apply -f k8s/analytics-service/service.yaml
          kubectl apply -f k8s/api-gateway/service.yaml
          kubectl apply -f k8s/frontend/service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api-gateway          -n ${{ env.K8S_NS }} --timeout=300s
          kubectl rollout status deployment/auth-service         -n ${{ env.K8S_NS }} --timeout=300s
          kubectl rollout status deployment/notification-service -n ${{ env.K8S_NS }} --timeout=300s
          kubectl rollout status deployment/delivery-service     -n ${{ env.K8S_NS }} --timeout=300s
          kubectl rollout status deployment/analytics-service    -n ${{ env.K8S_NS }} --timeout=300s
          kubectl rollout status deployment/frontend             -n ${{ env.K8S_NS }} --timeout=300s

      - name: Verify health
        run: |
          kubectl get pods -n ${{ env.K8S_NS }}
          kubectl get ingress -n ${{ env.K8S_NS }}
