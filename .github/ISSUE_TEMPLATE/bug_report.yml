name: Bug Report
description: Report a bug or unexpected behaviour in PingPulse
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - SimanchalaSethi

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below as completely as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I call POST /api/v1/notifications with X, the response is Y instead of Z."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behaviour.
      placeholder: |
        1. Start services with `docker compose up`
        2. POST /api/v1/...
        3. Observe error in logs
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened? Include error messages or stack traces.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: service
    attributes:
      label: Affected Service
      multiple: true
      options:
        - api-gateway
        - auth-service
        - notification-service
        - delivery-service
        - analytics-service
        - frontend
        - infrastructure / k8s
        - CI/CD
        - other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / Commit SHA
      placeholder: "e.g. main@abc1234"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Environment details, logs, screenshots, anything else relevant.
    validations:
      required: false
