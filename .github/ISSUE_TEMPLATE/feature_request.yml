name: Feature Request
description: Propose a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
assignees:
  - SimanchalaSethi

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to PingPulse!

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve? What is currently missing or painful?
      placeholder: "As a developer, I cannot X because Y..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you'd like to see, including API shape if applicable.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've already tried or considered.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - New notification channel
        - API / developer experience
        - Observability / monitoring
        - Performance / scalability
        - Security
        - Infrastructure / deployment
        - Frontend dashboard
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Mockups, diagrams, references to similar systems, etc.
    validations:
      required: false
